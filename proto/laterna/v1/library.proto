syntax = "proto3";

package laterna.v1;

import "google/protobuf/timestamp.proto";
import "laterna/v1/options.proto";

option go_package = "github.com/laterna-project/laterna/internal/api/gen/laterna/v1;laternav1";

// LibraryService manages the libraries: folders of the same kind that the server walks, analyzes
// and keeps up to date. Administrators only; browsing the content is the catalog's job.
//
// The server never changes the files of a library. A renamed or moved file keeps its history (it is
// identified by fingerprint), and a folder that becomes unreachable (network share down) does not
// empty the library.
service LibraryService {
  // ListLibraries lists the libraries, in their order, with their item counts.
  rpc ListLibraries(ListLibrariesRequest) returns (ListLibrariesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_ADMIN;
  }
  // CreateLibrary creates a library and starts its first scan.
  rpc CreateLibrary(CreateLibraryRequest) returns (CreateLibraryResponse) {
    option (access) = ACCESS_ADMIN;
  }
  // UpdateLibrary changes a library; changing its folders triggers a scan.
  rpc UpdateLibrary(UpdateLibraryRequest) returns (UpdateLibraryResponse) {
    option (access) = ACCESS_ADMIN;
  }
  // DeleteLibrary deletes a library and its catalog (never the files).
  rpc DeleteLibrary(DeleteLibraryRequest) returns (DeleteLibraryResponse) {
    option (access) = ACCESS_ADMIN;
  }
  // ScanLibrary asks for a scan right now. Scans also run at startup and periodically; the response
  // does not wait for the scan to finish.
  rpc ScanLibrary(ScanLibraryRequest) returns (ScanLibraryResponse) {
    option (access) = ACCESS_ADMIN;
  }
  // ReorderLibraries puts the libraries in the given order. That order is the one of their lists
  // (ListLibraries, CatalogService.ListCatalogLibraries) and, kind by kind, of the recently added
  // rows of the home page. As long as nobody ordered the libraries they come by kind (movies,
  // series, music, books, photos) then by name; a library created later is placed the same way,
  // after the ranked ones.
  rpc ReorderLibraries(ReorderLibrariesRequest) returns (ReorderLibrariesResponse) {
    option (access) = ACCESS_ADMIN;
  }
  // BrowseFolders browses the folders of the server, to choose those of a library (or the folder of
  // a Jellyfin server to import) from a client that cannot see its disks. Without a path: the
  // starting points (drives on Windows; elsewhere the root and the usual mount folders). Only
  // folder names are given out, never file contents; hidden and system folders and Laterna's own
  // are left out. NOT_FOUND if the folder does not exist, PERMISSION_DENIED if the server cannot
  // read it.
  rpc BrowseFolders(BrowseFoldersRequest) returns (BrowseFoldersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_ADMIN;
  }
}

// LibraryKind decides how the files are understood.
enum LibraryKind {
  LIBRARY_KIND_UNSPECIFIED = 0;
  // Movies: one folder or one file per movie, versions and parts grouped.
  LIBRARY_KIND_MOVIES = 1;
  // Series and anime: series, seasons, episodes.
  LIBRARY_KIND_SHOWS = 2;
  // Music: artists, albums, tracks, from the tags of the audio files (MusicService).
  LIBRARY_KIND_MUSIC = 3;
  // Books: EPUB, PDF, CBZ; series and volumes (BookService).
  LIBRARY_KIND_BOOKS = 4;
  // Photos: JPEG, PNG, WebP, GIF; one album per folder (PhotoService).
  LIBRARY_KIND_PHOTOS = 5;
}

message Library {
  string id = 1;
  string name = 2;
  LibraryKind kind = 3;
  // Absolute folders, as the server sees them.
  repeated string paths = 4;
  // Language of the metadata (BCP 47, "en-US").
  string language = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // End of the last successful scan; unset if the library was never scanned.
  google.protobuf.Timestamp last_scan_at = 8;
}

// ItemCounts counts the items of a library.
message ItemCounts {
  int32 movies = 1;
  int32 series = 2;
  int32 seasons = 3;
  int32 episodes = 4;
  int32 artists = 5;
  int32 albums = 6;
  int32 tracks = 7;
  int32 book_series = 8;
  int32 books = 9;
  int32 photo_albums = 10;
  int32 photos = 11;
}

message LibrarySummary {
  Library library = 1;
  ItemCounts counts = 2;
}

message ReorderLibrariesRequest {
  // Every library, in the wanted order: each one once, and only once.
  repeated string library_ids = 1;
}

message ReorderLibrariesResponse {
  // The libraries, in their new order.
  repeated LibrarySummary libraries = 1;
}

message ListLibrariesRequest {}

message ListLibrariesResponse {
  repeated LibrarySummary libraries = 1;
}

message CreateLibraryRequest {
  string name = 1;
  LibraryKind kind = 2;
  // At least one absolute, existing folder that overlaps no other library.
  repeated string paths = 3;
  // Empty means "en-US".
  string language = 4;
}

message CreateLibraryResponse {
  Library library = 1;
}

message UpdateLibraryRequest {
  string library_id = 1;
  optional string name = 2;
  // New full list of folders; empty leaves it unchanged (a library always has at least one folder).
  repeated string paths = 3;
  optional string language = 4;
}

message UpdateLibraryResponse {
  Library library = 1;
}

message DeleteLibraryRequest {
  string library_id = 1;
}

message DeleteLibraryResponse {}

message ScanLibraryRequest {
  string library_id = 1;
}

message ScanLibraryResponse {}

message BrowseFoldersRequest {
  // Absolute path as the server sees it; empty means the starting points.
  string path = 1;
}

message BrowseFoldersResponse {
  // Normalized path of the folder; empty for the starting points.
  string path = 1;
  // Folder above; empty at the root of a disk (going up means asking for the starting points).
  string parent = 2;
  // Its subfolders, in natural order ("Season 2" before "Season 10").
  repeated Folder folders = 3;
  // Media files of this very folder.
  MediaCounts media = 4;
  // Library this folder touches, if any.
  FolderLibrary library = 5;
  // More than 1,000 subfolders: only the first ones are given.
  bool truncated = 6;
}

// Folder is a folder offered by the picker.
message Folder {
  string name = 1;
  string path = 2;
  // The server can open it.
  bool readable = 3;
  // It has at least one folder (among its first entries).
  bool has_subfolders = 4;
  // Media files among its first entries (200): a hint to choose the kind of the library, not a
  // count.
  MediaCounts media = 5;
  // Library this folder touches: choosing it for another one would be refused.
  FolderLibrary library = 6;
}

message MediaCounts {
  int32 videos = 1;
  int32 audio = 2;
  int32 books = 3;
  int32 photos = 4;
}

// FolderLibrary is the library a folder touches, and how.
message FolderLibrary {
  string library_id = 1;
  string library_name = 2;
  FolderRelation relation = 3;
}

enum FolderRelation {
  FOLDER_RELATION_UNSPECIFIED = 0;
  // It is one of the library's folders.
  FOLDER_RELATION_ROOT = 1;
  // It is inside one of its folders.
  FOLDER_RELATION_INSIDE = 2;
  // It contains one of its folders.
  FOLDER_RELATION_CONTAINS = 3;
}
