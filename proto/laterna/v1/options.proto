syntax = "proto3";

package laterna.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/laterna-project/laterna/internal/api/gen/laterna/v1;laternav1";

// Access says who may call a method. The server enforces it before running the call. A method
// without the option requires a picked profile by default, so forgetting to protect one is not
// possible.
enum Access {
  // Default value: same as ACCESS_PROFILE.
  ACCESS_UNSPECIFIED = 0;
  // No authentication (server discovery, login).
  ACCESS_PUBLIC = 1;
  // Signed-in account, profile not necessarily picked (profile selection, device management).
  ACCESS_ACCOUNT = 2;
  // Signed-in account and picked profile: everything that touches the catalog and playback.
  ACCESS_PROFILE = 3;
  // Administrator account. A profile is not required, but a restricted one is refused.
  ACCESS_ADMIN = 4;
}

// ApiTokens says which API tokens may call a method (AuthService.CreateApiToken). A token acts as
// the profile that created it, within the method's access level.
enum ApiTokens {
  // Default value: any token for a method without side effects (idempotency_level
  // NO_SIDE_EFFECTS), only a full one otherwise.
  API_TOKENS_UNSPECIFIED = 0;
  // Any token, read-only ones too: a method that only reads although its idempotency level cannot
  // say so (a stream).
  API_TOKENS_READ = 1;
  // No token: the method manages the credentials of the account (password, passkeys, sessions,
  // tokens, device logins, accounts, single sign-on) or the profile of the session. A leaked token
  // can neither lock its owner out nor hand out more access.
  API_TOKENS_NONE = 2;
}

extend google.protobuf.MethodOptions {
  // Access level the method requires.
  Access access = 50001;
  // API tokens the method accepts.
  ApiTokens api_tokens = 50002;
}
