syntax = "proto3";

package laterna.v1;

import "google/protobuf/timestamp.proto";
import "laterna/v1/catalog.proto";
import "laterna/v1/options.proto";
import "laterna/v1/text.proto";

option go_package = "github.com/laterna-project/laterna/internal/api/gen/laterna/v1;laternav1";

// NotificationService gives a profile what it was told about while it was not looking: what became
// of its requests, new episodes of the series it follows and, for administrators, the requests
// that wait for them. Each profile keeps its last 200 notifications for 60 days.
//
// A change is announced through EventService (NotificationsChanged), to the devices of the
// profile: a notification arrived, or some were read or deleted from another device.
//
// A device can also be told while the app is closed, by web push (RFC 8030): a browser subscribes
// with the server's public key (GetPushConfig) and gives the server its subscription
// (SubscribePush). Each notification of the profile picked on that device is then sent to it,
// encrypted for it (RFC 8291): the push service of the browser only carries it. The message is a
// JSON object:
//
//   {"id": "...", "kind": "request_available", "title": "<server name>",
//    "body": "<the notification, in the language of the profile>",
//    "item_id": "...", "request_id": "..."}
//
// kind is the NotificationKind in lower case without its prefix; item_id and request_id are left
// out when there is none.
service NotificationService {
  // ListNotifications lists the notifications of the profile, newest first, with how many it has
  // not read.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // MarkNotificationsRead marks notifications of the profile as read.
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteNotifications removes notifications of the profile.
  rpc DeleteNotifications(DeleteNotificationsRequest) returns (DeleteNotificationsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // GetPushConfig returns the public key a browser subscribes to web push with, and the
  // subscription this device has.
  rpc GetPushConfig(GetPushConfigRequest) returns (GetPushConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SubscribePush stores the web push subscription of this device, in place of the one it had. It
  // goes away with the session (sign-out, device revoked).
  rpc SubscribePush(SubscribePushRequest) returns (SubscribePushResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // UnsubscribePush forgets the web push subscription of this device.
  rpc UnsubscribePush(UnsubscribePushRequest) returns (UnsubscribePushResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Alerts tell a Discord channel, an ntfy topic or any web service (a JSON webhook: Home
  // Assistant, a script) what happens on the server, for the whole household: requests, new
  // episodes, playbacks, problems. They are entries of the activity log, written in the server's
  // language, and are set up by administrators; a channel on the local network is fine. A message
  // that cannot be delivered is tried again three times, then given up: the channel says why.
  //
  // The webhook receives a JSON object, signed when a secret is set (header
  // "X-Laterna-Signature: sha256=<HMAC-SHA256 of the body, in hex>"):
  //
  //   {"server": {"id": "...", "name": "..."}, "category": "requests", "kind": "request",
  //    "text": "<the entry, in the server's language>", "key": "activity....", "params": {...},
  //    "warning": false, "at": "2026-10-18T20:15:00Z", "item_id": "..."}
  //
  // category is the AlertCategory in lower case without its prefix, kind the ActivityKind in the
  // same form, key and params the text before it is written (Text); item_id is left out when there
  // is none.

  // ListAlertChannels lists the three channels and how their last messages went.
  rpc ListAlertChannels(ListAlertChannelsRequest) returns (ListAlertChannelsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (access) = ACCESS_ADMIN;
  }
  // SetAlertChannel sets up a channel. A Discord webhook must be one of discord.com; the other two
  // take any http or https address.
  rpc SetAlertChannel(SetAlertChannelRequest) returns (SetAlertChannelResponse) {
    option (access) = ACCESS_ADMIN;
    option (api_tokens) = API_TOKENS_NONE;
  }
  // TestAlertChannel sends a test message to a channel set up, and waits for it to arrive:
  // FAILED_PRECONDITION (alert.delivery_failed) if it does not.
  rpc TestAlertChannel(TestAlertChannelRequest) returns (TestAlertChannelResponse) {
    option (access) = ACCESS_ADMIN;
  }
}

// AlertChannelKind is where alerts go.
enum AlertChannelKind {
  ALERT_CHANNEL_KIND_UNSPECIFIED = 0;
  // A Discord webhook.
  ALERT_CHANNEL_KIND_DISCORD = 1;
  // An ntfy topic, on ntfy.sh or a server of one's own.
  ALERT_CHANNEL_KIND_NTFY = 2;
  // Any web service, which receives a JSON object.
  ALERT_CHANNEL_KIND_WEBHOOK = 3;
}

// AlertCategory says what an alert is about.
enum AlertCategory {
  ALERT_CATEGORY_UNSPECIFIED = 0;
  // A request created, approved, declined, available or failed.
  ALERT_CATEGORY_REQUESTS = 1;
  // Episodes that arrived, one message per series once it has been quiet for a while.
  ALERT_CATEGORY_NEW_EPISODES = 2;
  // A playback that starts: who watches or listens to what, on which device.
  ALERT_CATEGORY_PLAYBACK = 3;
  // What is worth a look: a refused sign-in, a background job that failed.
  ALERT_CATEGORY_PROBLEMS = 4;
}

// AlertChannel is a channel, without its secrets.
message AlertChannel {
  AlertChannelKind kind = 1;
  // False until it is set up, or while it is paused.
  bool enabled = 2;
  // Where it goes, shortened before its secret part: "discord.com/api/webhooks/1234…",
  // "ntfy.sh/laterna", "homeassistant.local:8123/api/webhook/…"; empty if it is not set up.
  string target = 3;
  repeated AlertCategory categories = 4;
  // ntfy: an access token is set. Webhook: a signing secret is set.
  bool has_token = 5;
  // Last message delivered; unset if none yet.
  google.protobuf.Timestamp last_sent_at = 6;
  // Why the last message could not be delivered (alert.delivery_failed, alert.unreachable...);
  // unset if it was, or before the first one.
  Text last_error = 7;
  google.protobuf.Timestamp last_error_at = 8;
}

message ListAlertChannelsRequest {}

message ListAlertChannelsResponse {
  // Discord, ntfy and the webhook, in this order.
  repeated AlertChannel channels = 1;
}

message SetAlertChannelRequest {
  AlertChannelKind kind = 1;
  bool enabled = 2;
  // Discord: the webhook URL of the channel. ntfy: the URL of the topic ("https://ntfy.sh/laterna").
  // Webhook: where the JSON is POSTed. Unset keeps the one set; empty removes the channel.
  optional string url = 3;
  // ntfy: an access token, sent as "Authorization: Bearer". Webhook: the secret that signs each
  // body. Unset keeps the one set; empty removes it. Discord takes none.
  optional string token = 4;
  // At least one when the channel is enabled.
  repeated AlertCategory categories = 5;
}

message SetAlertChannelResponse {
  AlertChannel channel = 1;
}

message TestAlertChannelRequest {
  AlertChannelKind kind = 1;
}

message TestAlertChannelResponse {}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  // A request waits for an administrator. Sent to the administrators.
  NOTIFICATION_KIND_REQUEST_PENDING = 1;
  // A request of the profile was approved by someone else.
  NOTIFICATION_KIND_REQUEST_APPROVED = 2;
  // A request of the profile was declined; the text carries the reason when there is one.
  NOTIFICATION_KIND_REQUEST_DECLINED = 3;
  // What a request of the profile asked for is in the catalog.
  NOTIFICATION_KIND_REQUEST_AVAILABLE = 4;
  // A request could not be handed to its source. Sent to its profile and to the administrators.
  NOTIFICATION_KIND_REQUEST_FAILED = 5;
  // Episodes arrived for a series the profile follows: one of its favorites, or one it played or
  // started an episode of. Episodes that arrive together make one notification.
  NOTIFICATION_KIND_NEW_EPISODES = 6;
  // The albums of an artist the profile asked for can be chosen (REQUEST_STATUS_CHOOSING).
  NOTIFICATION_KIND_REQUEST_CHOOSE = 7;
}

message Notification {
  string id = 1;
  NotificationKind kind = 2;
  // Sentence written by the server in the language of the request.
  string summary = 3;
  // The same, for translation ("notification.request_available", param "title";
  // "notification.new_episodes", params "series" and "count"...).
  Text text = 4;
  google.protobuf.Timestamp created_at = 5;
  bool read = 6;
  // What to open, when the profile sees it: the title a request got, the episode that arrived or,
  // for several, their series. Unset otherwise.
  SearchResult item = 7;
  // The request it is about; empty otherwise, or once the request is gone.
  string request_id = 8;
  // Poster of that request, served by the server: a path to append to the server's address. Empty
  // without one.
  string poster_url = 9;
}

message ListNotificationsRequest {
  // Token from the previous page; empty starts from the newest.
  string page_token = 1;
  // 1 to 100; 0 means 30.
  int32 page_size = 2;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // Notifications the profile has not read, on every page.
  int32 unread_count = 3;
}

message MarkNotificationsReadRequest {
  // The notifications to mark, 200 at most; those of another profile are ignored.
  repeated string notification_ids = 1;
  // True for all of them; notification_ids is then left empty.
  bool all = 2;
}

message MarkNotificationsReadResponse {}

message DeleteNotificationsRequest {
  // The notifications to remove, 200 at most; those of another profile are ignored.
  repeated string notification_ids = 1;
  // True for all of them; notification_ids is then left empty.
  bool all = 2;
}

message DeleteNotificationsResponse {}

message GetPushConfigRequest {}

message GetPushConfigResponse {
  // The server's key, as PushManager.subscribe takes it (applicationServerKey): an uncompressed
  // P-256 point in base64url. It never changes.
  string public_key = 1;
  // Endpoint this device is subscribed with; empty if it is not. A browser whose own subscription
  // has another endpoint subscribes again.
  string endpoint = 2;
}

// SubscribePushRequest carries what PushSubscription.toJSON() gives.
message SubscribePushRequest {
  // Address of the push service for this device: https only.
  string endpoint = 1;
  // keys.p256dh and keys.auth, in base64url.
  string p256dh = 2;
  string auth = 3;
}

message SubscribePushResponse {}

message UnsubscribePushRequest {}

message UnsubscribePushResponse {}
