syntax = "proto3";

package laterna.v1;

import "google/protobuf/timestamp.proto";
import "laterna/v1/catalog.proto";
import "laterna/v1/text.proto";

option go_package = "github.com/laterna-project/laterna/internal/api/gen/laterna/v1;laternav1";

// NotificationService gives a profile what it was told about while it was not looking: what became
// of its requests, new episodes of the series it follows and, for administrators, the requests
// that wait for them. Each profile keeps its last 200 notifications for 60 days.
//
// A change is announced through EventService (NotificationsChanged), to the devices of the
// profile: a notification arrived, or some were read or deleted from another device.
service NotificationService {
  // ListNotifications lists the notifications of the profile, newest first, with how many it has
  // not read.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // MarkNotificationsRead marks notifications of the profile as read.
  rpc MarkNotificationsRead(MarkNotificationsReadRequest) returns (MarkNotificationsReadResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteNotifications removes notifications of the profile.
  rpc DeleteNotifications(DeleteNotificationsRequest) returns (DeleteNotificationsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  // A request waits for an administrator. Sent to the administrators.
  NOTIFICATION_KIND_REQUEST_PENDING = 1;
  // A request of the profile was approved by someone else.
  NOTIFICATION_KIND_REQUEST_APPROVED = 2;
  // A request of the profile was declined; the text carries the reason when there is one.
  NOTIFICATION_KIND_REQUEST_DECLINED = 3;
  // What a request of the profile asked for is in the catalog.
  NOTIFICATION_KIND_REQUEST_AVAILABLE = 4;
  // A request could not be handed to its source. Sent to its profile and to the administrators.
  NOTIFICATION_KIND_REQUEST_FAILED = 5;
  // Episodes arrived for a series the profile follows: one of its favorites, or one it played or
  // started an episode of. Episodes that arrive together make one notification.
  NOTIFICATION_KIND_NEW_EPISODES = 6;
}

message Notification {
  string id = 1;
  NotificationKind kind = 2;
  // Sentence written by the server in the language of the request.
  string summary = 3;
  // The same, for translation ("notification.request_available", param "title";
  // "notification.new_episodes", params "series" and "count"...).
  Text text = 4;
  google.protobuf.Timestamp created_at = 5;
  bool read = 6;
  // What to open, when the profile sees it: the title a request got, the episode that arrived or,
  // for several, their series. Unset otherwise.
  SearchResult item = 7;
  // The request it is about; empty otherwise, or once the request is gone.
  string request_id = 8;
  // Poster of that request, served by the server: a path to append to the server's address. Empty
  // without one.
  string poster_url = 9;
}

message ListNotificationsRequest {
  // Token from the previous page; empty starts from the newest.
  string page_token = 1;
  // 1 to 100; 0 means 30.
  int32 page_size = 2;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  // Empty on the last page.
  string next_page_token = 2;
  // Notifications the profile has not read, on every page.
  int32 unread_count = 3;
}

message MarkNotificationsReadRequest {
  // The notifications to mark, 200 at most; those of another profile are ignored.
  repeated string notification_ids = 1;
  // True for all of them; notification_ids is then left empty.
  bool all = 2;
}

message MarkNotificationsReadResponse {}

message DeleteNotificationsRequest {
  // The notifications to remove, 200 at most; those of another profile are ignored.
  repeated string notification_ids = 1;
  // True for all of them; notification_ids is then left empty.
  bool all = 2;
}

message DeleteNotificationsResponse {}
