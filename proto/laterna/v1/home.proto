syntax = "proto3";

package laterna.v1;

import "google/protobuf/timestamp.proto";
import "laterna/v1/catalog.proto";
import "laterna/v1/text.proto";

option go_package = "github.com/laterna-project/laterna/internal/api/gen/laterna/v1;laternav1";

// HomeService builds the home page of the picked profile. The server decides which rows there are
// and in what order: every client shows the same home page, and it gets better without updating
// them.
//
// The order: what is in progress (resume, next up, continue reading); recently added in movie and
// series libraries; what is coming; recommendations; music (recently played albums, then recently
// added); recently added books, then photos. Within each group, libraries follow the order chosen
// by the administrator (LibraryService.ReorderLibraries).
service HomeService {
  // GetHome returns the rows of the home page; empty rows are left out.
  rpc GetHome(GetHomeRequest) returns (GetHomeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum HomeRowKind {
  HOME_ROW_KIND_UNSPECIFIED = 0;
  // Movies and episodes started, most recently played first.
  HOME_ROW_KIND_RESUME = 1;
  // For each series in progress, the episode after the last one played.
  HOME_ROW_KIND_NEXT_UP = 2;
  // Movies recently added to a library.
  HOME_ROW_KIND_LATEST_MOVIES = 3;
  // Series of a library, starting with the one that got an episode most recently.
  HOME_ROW_KIND_LATEST_SERIES = 4;
  // Albums the profile played a track of, most recent listen first.
  HOME_ROW_KIND_RECENT_ALBUMS = 5;
  // Albums recently added to a music library.
  HOME_ROW_KIND_LATEST_ALBUMS = 6;
  // Books started and not finished, most recently read first.
  HOME_ROW_KIND_READING = 7;
  // Books recently added to a book library.
  HOME_ROW_KIND_LATEST_BOOKS = 8;
  // Photos recently added to a photo library.
  HOME_ROW_KIND_LATEST_PHOTOS = 9;
  // Movies and series the profile has not watched, close to what it did watch (genres, directors,
  // actors, collection...), closest first.
  HOME_ROW_KIND_RECOMMENDED = 10;
  // Movies and series close to a movie or a series the profile watched recently (source_item_id).
  HOME_ROW_KIND_BECAUSE_YOU_WATCHED = 11;
  // Episodes, movies and albums that Sonarr, Radarr and Lidarr expect in the next two weeks and do
  // not have yet, soonest first. Nothing of it is in the catalog: the row has no items, its entries
  // are in HomeRow.upcoming. Only sent to a client that asks for it (GetHomeRequest.upcoming).
  HOME_ROW_KIND_UPCOMING = 12;
}

enum UpcomingKind {
  UPCOMING_KIND_UNSPECIFIED = 0;
  UPCOMING_KIND_EPISODE = 1;
  UPCOMING_KIND_MOVIE = 2;
  UPCOMING_KIND_ALBUM = 3;
}

// UpcomingRelease is an episode, a movie or an album that an instance monitors and does not have
// yet. A profile only gets those of libraries it may browse, under its parental control.
message UpcomingRelease {
  UpcomingKind kind = 1;
  // Title of the episode, the movie or the album.
  string title = 2;
  // Series of an episode, artist of an album; empty for a movie.
  string parent_title = 3;
  // Season and number of an episode.
  int32 season_number = 4;
  int32 episode_number = 5;
  // When the episode airs. For a movie (the day it comes out at home, not in theaters) or an
  // album, midnight UTC of that day.
  google.protobuf.Timestamp release_time = 6;
  // True when release_time is a day and not a moment: read its date in UTC, whatever the time zone
  // of the device.
  bool all_day = 7;
  // Series or artist in the catalog, when the profile sees it there; empty for a movie, or for a
  // series or an artist that has nothing yet.
  string item_id = 8;
  // Images of that series or artist.
  repeated Image images = 9;
  // Without images, the poster the instance names (the album's cover for an album), served by the
  // server: a path to append to the server's address. Empty without one.
  string poster_url = 10;
}

message HomeItem {
  oneof item {
    MovieSummary movie = 1;
    SeriesSummary series = 2;
    Episode episode = 3;
    AlbumSummary album = 4;
    BookSummary book = 5;
    PhotoSummary photo = 6;
  }
}

message HomeRow {
  HomeRowKind kind = 1;
  // Title written by the server in the language of the request ("Resume", "Recently added in
  // Movies"); title_text gives it for translation.
  string title = 2;
  // Library of a recently added row; empty otherwise.
  string library_id = 3;
  repeated HomeItem items = 4;
  // Movie or series of a HOME_ROW_KIND_BECAUSE_YOU_WATCHED row; empty otherwise.
  string source_item_id = 5;
  // The title, for translation: "home.resume", "home.latest" (param "library": the name of the
  // library), "home.because_you_watched" (param "title")...
  Text title_text = 6;
  // Entries of a HOME_ROW_KIND_UPCOMING row; empty otherwise.
  repeated UpcomingRelease upcoming = 7;
}

message GetHomeRequest {
  // Items per row: 1 to 50; 0 means 20.
  int32 row_size = 1;
  // True to also get the row of what is coming (HOME_ROW_KIND_UPCOMING), for a client that shows
  // its entries.
  bool upcoming = 2;
}

message GetHomeResponse {
  repeated HomeRow rows = 1;
}
