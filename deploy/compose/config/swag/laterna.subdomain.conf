## Laterna behind SWAG (modules/swag.yaml): https://laterna.<your domain>
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name laterna.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app laterna;
        set $upstream_port 8096;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Video segments and the event stream go out as they come.
        proxy_buffering off;
    }
}
