# Sonarr (series) and Radarr (movies) next to Laterna. They name the files and write the NFO files
# and images Laterna reads; Laterna then hears about each import right away. Both see MEDIA_DIR at
# /media, like Laterna, but may write there. Their download client is not here: the media stack
# of https://github.com/laterna-project/laterna-stack has one.
#
# Then, in Laterna (Administration, Sonarr and Radarr): http://sonarr:8989 and http://radarr:7878,
# the API key of each (Settings, General), and http://laterna:8096 as the webhook address.
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - sonarr-config:/config
      - ${MEDIA_DIR:-./empty}:/media

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - radarr-config:/config
      - ${MEDIA_DIR:-./empty}:/media

volumes:
  sonarr-config:
  radarr-config:
