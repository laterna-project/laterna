# Single sign-on with Keycloak: a complete identity server (user federation with LDAP or Active
# Directory, social logins, fine-grained policies), with its PostgreSQL. Its address, AUTH_HOST,
# needs HTTPS: with a Caddy module add modules/auth-caddy.yaml; the traefik module serves it by
# itself. The realm "laterna" and its client "laterna" are created at the first start; add users
# in the administration console, https://<AUTH_HOST>/admin (user KEYCLOAK_ADMIN, password
# KEYCLOAK_ADMIN_PASSWORD, for that first start only). In Laterna (Administration,
# Authentication): provider https://<AUTH_HOST>/realms/laterna, client laterna, secret
# OIDC_CLIENT_SECRET.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_HOSTNAME: ${AUTH_URL:-https://${AUTH_HOST:?set AUTH_HOST in .env}}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "9091"
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Read by the realm file when it is imported.
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET in .env}
      LATERNA_URL: ${LATERNA_URL:-https://${LATERNA_HOST:?set LATERNA_HOST in .env}}
    healthcheck:
      # The image has no curl: bash asks the management port itself, which answers 200 once
      # Keycloak is ready.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      start_period: 120s
    networks:
      default:
        # The name modules/auth-caddy.yaml forwards to, whichever provider it is.
        aliases: [auth]
    labels:
      traefik.enable: "true"
      traefik.http.routers.auth.rule: Host(`${AUTH_HOST}`)
      traefik.http.routers.auth.entrypoints: websecure
      traefik.http.routers.auth.tls.certresolver: letsencrypt
      traefik.http.services.auth.loadbalancer.server.port: "9091"
    volumes:
      - ./config/keycloak/laterna-realm.json:/opt/keycloak/data/import/laterna-realm.json:ro

  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak"]
      interval: 5s
    volumes:
      - keycloak-db:/var/lib/postgresql/data

volumes:
  keycloak-db:
