# The FFmpeg build Laterna is tested with and ships: a static GPL build from
# https://github.com/BtbN/FFmpeg-Builds, pinned by release and checked by SHA-256.
# Read by packaging/fetch-ffmpeg.sh, which the Docker image, CI and the release bundles all use.
# BtbN deletes its daily builds after about two weeks, so the FFmpeg mirror workflow copies the
# pinned one to FFMPEG_MIRROR, where fetch-ffmpeg.sh looks first.
FFMPEG_MIRROR=https://github.com/laterna-project/laterna/releases/download/ffmpeg-builds
FFMPEG_RELEASE=autobuild-2026-10-14-13-03
FFMPEG_NAME=ffmpeg-n9.0.2-27-g7e93014c5b
FFMPEG_VARIANT=gpl-9.0
FFMPEG_SHA256_LINUX64=2678b5af04abe364b71566b56bd556645f96883f64cf8ea0945ccfa3eda4ab3f
FFMPEG_SHA256_LINUXARM64=347322e535567ce7e7291be3ebf714b86a1198bb04433d38d956a5f5d88d0016
FFMPEG_SHA256_WIN64=f854c8dd01ef8a1e1b433687b3c7ff7a50dd4c89a5f99b57f7822b471f21085d
FFMPEG_SHA256_WINARM64=65d6734e86085de5d8cad70263c9a34431b038f67cf0053313cdd823decaaa5b
