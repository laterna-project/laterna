name: Weekly

# Checks that do not belong on every push: new advisories against unchanged code, fuzzing,
# performance budgets, vulnerabilities in the published image, and a newer web client to pin.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  vuln:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task vuln

  web:
    name: Web client release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Newer release than the pinned one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . packaging/web.lock
          latest=$(gh release view --repo laterna-project/laterna-web --json tagName --jq .tagName)
          if [ "$latest" != "v$WEB_VERSION" ]; then
            echo "::notice::Laterna Web $latest is out; the image serves v$WEB_VERSION (packaging/update-web.sh)."
          fi

  fuzz:
    name: Fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz every target for 30 s
        run: |
          go list ./... | while read -r pkg; do
            for target in $(go test "$pkg" -list '^Fuzz' | grep '^Fuzz' || true); do
              echo "::group::$pkg $target"
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 30s
              echo "::endgroup::"
            done
          done
      - name: Keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: FFmpeg
        run: |
          sh packaging/fetch-ffmpeg.sh linux amd64 "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      # Startup and idle memory are stable on a shared runner; latencies are printed but not
      # enforced here, they depend too much on the machine.
      - run: go run ./devtools/perfcheck -max-startup 1s -max-idle-mb 60

  # The edge image is rebuilt even when develop did not move, to pick up the security updates of
  # its base system, then scanned: what is left has no fix yet or needs a change here.
  refresh:
    name: Edge image
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true

  scan:
    name: Image vulnerabilities
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/laterna:edge
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
