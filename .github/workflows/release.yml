name: Release

# A version tag builds the archives and packages, tries them, then publishes the release and the
# versioned Docker image. Run by hand, it builds a snapshot and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: Archives and packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: A release is tagged on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Pre-releases (v1.2.0-rc.1) are tagged on their release branch.
          case "$GITHUB_REF_NAME" in *-*) exit 0 ;; esac
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .goreleaser.yaml
      - name: FFmpeg for the bundles
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            sh packaging/fetch-ffmpeg.sh "${target%/*}" "${target#*/}" "packaging/ffmpeg/${target%/*}_${target#*/}"
          done
      - name: Build (snapshot)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Build and upload to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Try the bundle and the package
        run: sh packaging/test-release.sh dist
      - name: Provenance
        # Artifact attestations need a public repository.
        if: ${{ startsWith(github.ref, 'refs/tags/') && !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  image:
    name: Image
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true
