name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the previous commit is the reference for buf breaking
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reference for contract comparison
        id: against
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - run: task gen:check
      - run: task lint
      - run: task breaking AGAINST_REF=${{ steps.against.outputs.ref }}
      - run: task nilaway
      - run: task vuln
      - name: Shell scripts
        run: shellcheck -x packaging/*.sh packaging/scripts/*.sh docker/*.sh .github/scripts/*.sh
      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: FFmpeg
        run: |
          sh packaging/fetch-ffmpeg.sh linux amd64 "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      - run: task test:race
      - name: Fixtures (full generation)
        run: task fixtures

  platforms:
    name: Tests (${{ matrix.name }})
    # macOS and arm64 runners are only free for public repositories. While the repository is
    # private these jobs run on demand (workflow_dispatch).
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            os: ubuntu-24.04-arm
            ffmpeg: linux arm64
          - name: Windows
            os: windows-latest
            ffmpeg: windows amd64
          - name: macOS
            os: macos-latest
            ffmpeg: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: FFmpeg (pinned build)
        if: matrix.ffmpeg != ''
        run: |
          sh packaging/fetch-ffmpeg.sh ${{ matrix.ffmpeg }} "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
      - name: FFmpeg (Homebrew)
        if: runner.os == 'macOS'
        # The full formula has libass and zimg, which the plain one lacks. The wrapper hides the
        # VideoToolbox encoders, which hang or fail on hosted runners.
        run: |
          brew install ffmpeg-full
          keg="$(brew --prefix ffmpeg-full)/bin"
          mkdir -p "$RUNNER_TEMP/bin"
          cp .github/scripts/ffmpeg-no-videotoolbox.sh "$RUNNER_TEMP/bin/ffmpeg"
          chmod +x "$RUNNER_TEMP/bin/ffmpeg"
          echo "REAL_FFMPEG=$keg/ffmpeg" >> "$GITHUB_ENV"
          echo "$keg" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: FFmpeg in use
        run: |
          command -v ffmpeg ffprobe
          ffmpeg -hide_banner -version | head -n 1
      - run: go build ./...
      - run: go test ./...

  build:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A cache of its own, shared with the release workflow: the other jobs only build for
          # the runner.
          cache-dependency-path: |
            go.sum
            .goreleaser.yaml
      - name: Build every release target
        run: |
          for target in linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 freebsd/amd64; do
            echo "::group::build $target"
            GOOS=${target%/*} GOARCH=${target#*/} GOARM=7 go build ./...
            echo "::endgroup::"
          done
      - name: Vet the tests of each system
        run: |
          for target in windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "::group::vet $target"
            GOOS=${target%/*} GOARCH=${target#*/} GOARM=7 go vet ./...
            echo "::endgroup::"
          done

  image:
    name: Image
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      # "edge" follows develop. Versioned images are pushed by the release workflow.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
